<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartPathPilot – Bengaluru route optimizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1F0;--panel:#F8FAF9;--ink:#13232B;--mute:#5B6B72;--line:#CBD5D3;--route:#0B6E7D;--free:#2E9E6B;--mod:#D9A21A;--heavy:#E0662B;--sev:#B3263E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1F;--panel:#16252C;--ink:#E4EEF0;--mute:#93A6AD;--line:#2A3D45;--route:#4FD1DE}}
:root[data-theme="dark"]{--bg:#0F1A1F;--panel:#16252C;--ink:#E4EEF0;--mute:#93A6AD;--line:#2A3D45;--route:#4FD1DE}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Schibsted Grotesk',system-ui,sans-serif}
.app{display:grid;grid-template-columns:340px 1fr;gap:16px;max-width:1100px;margin:0 auto;padding:16px}
@media(max-width:820px){.app{grid-template-columns:1fr}}
h1{font-size:22px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}.sub{color:var(--mute);margin:0 0 14px;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
select,input[type=range]{width:100%}select{padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font:inherit;cursor:pointer}
.seg button.on{background:var(--route);color:#fff;border-color:var(--route)}
.w{display:flex;align-items:center;gap:8px;font-size:13px}.w span:first-child{width:78px;color:var(--mute)}.w b{width:34px;text-align:right;font-weight:600}
.routes{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;background:var(--bg)}
.card.sel{border:2px solid var(--route);padding:9px}
.card h3{margin:0 0 3px;font-size:15px;display:flex;justify-content:space-between}.card p{margin:0;font-size:12.5px;color:var(--mute)}
.badge{font-size:12px;font-weight:600;color:var(--route)}.note{margin-top:8px;font-size:13px;font-weight:600;color:var(--route)}
.map{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
svg{width:100%;height:auto;max-height:82vh;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mute);padding:6px 8px 2px}.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
text{font:11px 'Schibsted Grotesk',system-ui,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.node{cursor:pointer}.foot{font-size:12px;color:var(--mute);margin-top:10px}
h2{font-size:16px;margin:16px 0 6px}.eta{margin:0 0 8px}.steps{list-style:none;margin:0;padding:0}.steps li{display:grid;grid-template-columns:12px 1fr;column-gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.steps li span:last-child{grid-column:2;color:var(--mute)}.dot{width:10px;height:10px;border-radius:50%;margin-top:5px}
.tog label{display:flex;gap:8px;align-items:center;color:var(--ink);margin:4px 0}#swap,#loc,#sv{font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips button{padding:4px 9px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:12.5px inherit;cursor:pointer}#extra{margin-top:16px}
</style></head><body><div class="app">
<div>
<h1>SmartPathPilot</h1><p class="sub">Route optimizer for Bengaluru using distance, traffic and road condition. Simulated data.</p>
<div class="panel">
<label for="s">From</label><select id="s"></select>
<label for="d">To</label><select id="d"></select>
<label for="h">Departure time: <b id="hl"></b></label><input type="range" id="h" min="0" max="23" value="9">
<label>Day</label><div class="seg" id="day"><button data-v="weekday" class="on">Weekday</button><button data-v="weekend">Weekend</button></div>
<label>Weather</label><div class="seg" id="wx"><button data-v="dry" class="on">Dry</button><button data-v="rain">Rain</button></div>
<label>Traffic engine</label><div class="seg" id="eng"><button data-v="rule" class="on">Rule-based</button><button data-v="ml">ML model (API)</button></div><div class="foot" id="engnote"></div>
<label>What matters most</label>
<div class="w"><span>Travel time</span><input type="range" id="wt" min="0" max="10" value="6"><b></b></div>
<div class="w"><span>Distance</span><input type="range" id="wd" min="0" max="10" value="2"><b></b></div>
<div class="w"><span>Road quality</span><input type="range" id="wr" min="0" max="10" value="2"><b></b></div>
<label>Avoid</label><div class="tog"><label><input type="checkbox" id="ap"> Poor roads</label><label><input type="checkbox" id="aw"> Waterlogging-prone roads</label></div>
<div class="seg" style="margin-top:12px"><button id="swap">Swap</button><button id="loc">Use my location</button><button id="sv">Save trip</button></div><div class="foot" id="geo"></div><div class="chips" id="chips"></div>
<div class="routes" id="out"></div>
<div class="foot">Tip: click two junctions on the map to set From and To.</div>
</div></div>
<div><div class="map"><svg id="m" viewBox="0 0 10 10" role="img" aria-label="Map of Bengaluru road network with recommended route"></svg>
<div class="legend"><span><i style="background:var(--free)"></i>Free</span><span><i style="background:var(--mod)"></i>Moderate</span><span><i style="background:var(--heavy)"></i>Heavy</span><span><i style="background:var(--sev)"></i>Severe</span><span><i style="background:var(--route);height:6px"></i>Recommended route</span></div></div><div class="panel" id="extra"></div></div>
</div>
<script>
const N=[["Majestic", 12.9767, 77.5713], ["MG Road", 12.9756, 77.6066], ["Indiranagar", 12.9784, 77.6408], ["Koramangala", 12.9352, 77.6245], ["Silk Board", 12.9177, 77.6233], ["HSR Layout", 12.9116, 77.6474], ["Marathahalli", 12.9569, 77.7011], ["Whitefield", 12.9698, 77.75], ["KR Puram", 13.007, 77.696], ["Hebbal", 13.0358, 77.597], ["Yeshwanthpur", 13.0285, 77.54], ["Malleshwaram", 13.0035, 77.5643], ["Jayanagar", 12.925, 77.5938], ["Banashankari", 12.9255, 77.5468], ["Electronic City", 12.8452, 77.6602], ["Bellandur", 12.9304, 77.6784], ["Domlur", 12.961, 77.6387], ["Rajajinagar", 12.991, 77.552], ["JP Nagar", 12.9063, 77.5857], ["Kempegowda Airport", 13.1986, 77.7066], ["Yelahanka", 13.1007, 77.5963]]; // [name,lat,lon]
const S=[[0, 1, 4.97, 8.5, 1.306, 1.906, 1, 0, "Kasturba Rd / Cubbon Rd", "Good"], [0, 11, 4.0, 6.9, 1.188, 1.783, 2, 0, "Sampige Rd / CV Raman Rd", "Fair"], [0, 17, 3.42, 5.1, 1.216, 1.706, 2, 0, "Dr Rajkumar Rd", "Fair"], [0, 12, 8.12, 13.9, 1.302, 1.899, 2, 0, "Lalbagh Rd / KR Rd", "Fair"], [0, 13, 8.17, 14.0, 1.2, 1.8, 3, 0, "Mysore Rd - Kanakapura Rd link", "Fair"], [1, 2, 4.83, 8.3, 1.301, 2.0, 1, 0, "Old Madras Rd", "Good"], [1, 3, 6.36, 10.9, 1.404, 2.101, 2, 0, "Hosur Rd via Richmond Rd", "Fair"], [1, 16, 4.99, 7.5, 1.293, 1.893, 1, 0, "Old Airport Rd", "Good"], [2, 16, 2.53, 4.3, 1.302, 2.023, 1, 0, "100 Feet Rd / CMH Rd", "Good"], [2, 8, 8.81, 13.2, 1.402, 2.303, 3, 1, "Old Madras Rd (to KR Puram)", "Fair"], [16, 6, 8.81, 11.7, 1.402, 2.41, 2, 0, "Old Airport Rd (to Marathahalli)", "Fair"], [16, 3, 4.23, 6.3, 1.302, 2.016, 2, 0, "Intermediate Ring Rd", "Fair"], [3, 4, 2.54, 4.4, 1.477, 2.568, 3, 1, "Hosur Rd / Inner Ring Rd", "Fair"], [3, 15, 7.63, 11.4, 1.404, 2.412, 4, 1, "Sarjapur Rd / ORR link", "Poor"], [4, 5, 3.51, 5.3, 1.396, 2.189, 3, 1, "Hosur Rd - HSR link", "Fair"], [4, 12, 4.29, 7.4, 1.297, 1.986, 2, 0, "BTM - Jayanagar Rd", "Fair"], [4, 14, 11.7, 11.7, 1.299, 2.496, 1, 0, "Hosur Rd / Elevated Expressway", "Good"], [4, 18, 5.55, 8.3, 1.301, 2.108, 3, 0, "Bannerghatta Rd / JP Nagar link", "Fair"], [5, 15, 5.14, 6.9, 1.391, 2.478, 3, 1, "Outer Ring Rd (HSR - Bellandur)", "Fair"], [15, 6, 4.99, 6.0, 1.5, 2.8, 3, 1, "Outer Ring Rd (Bellandur - Marathahalli)", "Fair"], [6, 7, 7.14, 10.7, 1.402, 2.598, 4, 1, "Whitefield Main Rd / ITPL Rd", "Poor"], [6, 8, 7.28, 8.7, 1.402, 2.506, 3, 1, "Outer Ring Rd (Marathahalli - KR Puram)", "Fair"], [8, 7, 9.32, 12.4, 1.306, 2.202, 3, 0, "Hoskote - Whitefield Rd", "Fair"], [8, 9, 14.55, 17.5, 1.394, 2.394, 2, 1, "Outer Ring Rd (KR Puram - Hebbal)", "Fair"], [9, 11, 6.56, 9.8, 1.306, 2.01, 1, 0, "Bellary Rd / CV Raman link", "Good"], [9, 10, 8.1, 10.8, 1.296, 2.204, 2, 0, "Outer Ring Rd (Hebbal - Yeshwanthpur)", "Fair"], [9, 20, 9.38, 9.4, 1.202, 1.691, 1, 0, "Bellary Rd (NH44)", "Good"], [20, 19, 21.01, 15.8, 1.095, 1.399, 0, 0, "Airport Rd (NH44)", "Good"], [9, 19, 28.14, 24.1, 1.199, 1.801, 1, 0, "Hebbal - Airport Rd (NH44)", "Good"], [10, 11, 4.98, 7.5, 1.2, 1.787, 2, 0, "Tumkur Rd - Malleshwaram link", "Fair"], [10, 17, 5.68, 8.5, 1.2, 1.906, 2, 0, "Tumkur Rd / Chord Rd", "Fair"], [17, 11, 2.5, 4.3, 1.186, 1.791, 2, 0, "Sankey Rd / 8th Main", "Fair"], [12, 18, 2.93, 5.0, 1.2, 1.7, 1, 0, "Jayanagar - JP Nagar Rd", "Good"], [12, 13, 6.62, 11.3, 1.204, 1.805, 2, 0, "Kanakapura Rd link", "Fair"], [18, 13, 6.14, 9.2, 1.304, 1.902, 3, 0, "Kanakapura Rd", "Fair"], [14, 5, 9.77, 13.0, 1.3, 2.008, 3, 0, "Hosur Rd - HSR / Hosa Rd", "Fair"]];
const $=id=>document.getElementById(id);
const st={s:0,d:20,h:9,day:'weekday',wx:'dry',sel:0,pick:0,engine:'rule'};
const names=N.map(n=>n[0]);
// projection
const lats=N.map(n=>n[1]),lons=N.map(n=>n[2]),k=Math.cos(13*Math.PI/180),sc=1900,pad=60;
const minLo=Math.min(...lons),maxLat=Math.max(...lats);
const P=N.map(n=>[(n[2]-minLo)*k*sc+pad,(maxLat-n[1])*sc+pad]);
const W=Math.max(...P.map(p=>p[0]))+pad+40,H=Math.max(...P.map(p=>p[1]))+pad;
$('m').setAttribute('viewBox',`0 0 ${W} ${H}`);
const left=new Set(['Majestic','Rajajinagar','Yeshwanthpur','Malleshwaram','Banashankari','Jayanagar','JP Nagar','Hebbal','Yelahanka']);
function prof(h){const am=Math.exp(-(((h-9.5)/1.6)**2)),pm=Math.exp(-(((h-19)/2)**2));return Math.min(1,Math.max(am,pm)+.05)}
const PRED={};
function mult(e,i){const k=st.day+'-'+st.wx;if(st.engine=='ml'&&PRED[k])return PRED[k][st.h][i];
  let m=e.off+(e.pk-e.off)*prof(st.h);if(st.day=='weekend')m=1+(m-1)*.6;if(st.wx=='rain')m*=e[7]?1.25:1.10;return m}
async function loadPred(){const k=st.day+'-'+st.wx;if(PRED[k])return;
  const r=await fetch('/api/predictions?engine=ml&day='+st.day+'&weather='+st.wx);if(!r.ok)throw 0;PRED[k]=(await r.json()).multipliers;
  if(!st.mt){const m=await (await fetch('/api/metrics')).json();st.mt=`ML model (${m.model}): average error ${m.ml_mae} on held-out data, rule-based ${m.rule_mae}.`}}
async function refresh(){st.sel=0;
  if(st.engine=='ml'){try{await loadPred();$('engnote').textContent=st.mt}
  catch(e){st.engine='rule';$('eng').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v=='rule'));
    $('engnote').textContent='ML server not reachable, so the rule-based profile is used. Start the backend and open this page at http://localhost:8000.'}}
  else $('engnote').textContent='';
  draw()}
const E=S.map(r=>{const o=r.slice();o.off=r[4];o.pk=r[5];return o});
const adj=N.map(()=>[]);E.forEach((e,i)=>{adj[e[0]].push([e[1],i]);adj[e[1]].push([e[0],i])});
function eMetrics(){return E.map((e,i)=>{const m=mult(e,i);return{m,t:e[3]*m*(1+.03*e[6]),d:e[2],p:e[6]}})}
const pc={};
function paths(s,d){
  const ap=$('ap').checked,aw=$('aw').checked,key=s+'-'+d+'-'+ap+'-'+aw;
  if(pc[key])return pc[key];
  const all=[],seen=new Set([s]);
  (function dfs(u,path,ed){
    if(path.length>11)return;
    if(u==d){all.push([path.slice(),ed.slice()]);return}
    for(const[v,i]of adj[u]){if(seen.has(v)||(ap&&E[i][9]=='Poor')||(aw&&E[i][7]))continue;seen.add(v);path.push(v);ed.push(i);dfs(v,path,ed);path.pop();ed.pop();seen.delete(v)}
  })(s,[s],[]);
  return pc[key]=all;
}
function routes(M){
  const all=paths(st.s,st.d);
  if(!all.length)return [];
  const R=all.map(([p,ed])=>{let D=0,T=0,Rp=0;ed.forEach(i=>{D+=M[i].d;T+=M[i].t;Rp+=M[i].p*M[i].d});return{p,ed,D,T,Rp:Rp/D/5}});
  const byT=[...R].sort((a,b)=>a.T-b.T),sd=[...R].sort((a,b)=>a.D-b.D)[0];
  let c=byT.slice(0,3);if(!c.includes(sd))c.push(sd);
  const tm=Math.min(...c.map(r=>r.T)),dm=Math.min(...c.map(r=>r.D));
  const wt=+$('wt').value,wd=+$('wd').value,wr=+$('wr').value,ws=(wt+wd+wr)||1;
  c.forEach(r=>{r.sd=r===sd;r.score=(wt*r.T/tm+wd*r.D/dm+wr*(1+r.Rp))/ws});
  return c.sort((a,b)=>a.score-b.score);
}
const col=m=>m<1.3?'var(--free)':m<1.8?'var(--mod)':m<2.4?'var(--heavy)':'var(--sev)';
function draw(){
  const M=eMetrics(),R=st.s==st.d?[]:routes(M);
  const svg=$('m');let h='';
  E.forEach((e,i)=>{const a=P[e[0]],b=P[e[1]];h+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col(M[i].m)}" stroke-width="3" stroke-linecap="round" opacity=".55"><title>${e[8]}: ${M[i].t.toFixed(1)} min</title></line>`});
  R.slice().reverse().forEach(r=>{const idx=R.indexOf(r),on=idx==st.sel;
    const pts=r.p.map(n=>P[n].join(',')).join(' ');
    h+=`<polyline points="${pts}" fill="none" stroke="var(--route)" stroke-width="${on?9:4}" stroke-linejoin="round" stroke-linecap="round" opacity="${on?1:.45}" ${on?'':'stroke-dasharray="2 9"'}/>`});
  N.forEach((n,i)=>{const p=P[i],isE=i==st.s||i==st.d,l=left.has(n[0]);
    h+=`<g class="node" data-i="${i}"><circle cx="${p[0]}" cy="${p[1]}" r="${isE?9:5.5}" fill="${isE?'var(--route)':'var(--panel)'}" stroke="${isE?'var(--panel)':'var(--ink)'}" stroke-width="2"/><text x="${p[0]+(l?-11:11)}" y="${p[1]+4}" text-anchor="${l?'end':'start'}" ${isE?'font-weight="800"':''}>${n[0]}</text></g>`});
  svg.innerHTML=h;
  svg.querySelectorAll('.node').forEach(g=>g.onclick=()=>{const i=+g.dataset.i;if(st.pick==0){st.s=i;$('s').value=i}else{st.d=i;$('d').value=i}st.pick^=1;st.sel=0;draw()});
  const o=$('out');
  if(!R.length){o.innerHTML=st.s==st.d?'<p class="sub">Pick two different places to see routes.</p>':'<p class="sub">No route avoids those roads. Turn off a filter to see options.</p>';$('extra').innerHTML='';return}
  const sdr=R.find(r=>r.sd);
  o.innerHTML=R.map((r,i)=>`<div class="card ${i==st.sel?'sel':''}" data-i="${i}"><h3><span>${i==0?'Recommended':'Alternative '+i}</span><span class="badge">${r.T.toFixed(0)} min</span></h3><p>${r.D.toFixed(1)} km · road roughness ${(r.Rp*100).toFixed(0)}%${r.sd?' · shortest distance':''}</p><p>${r.p.map(n=>names[n]).join(' › ')}</p></div>`).join('')
   +(sdr&&sdr!==R[0]?`<div class="note">${(sdr.T-R[0].T).toFixed(0)} min faster than the shortest-distance route (${sdr.D.toFixed(1)} km).</div>`:`<div class="note">The shortest-distance route is also the best choice here.</div>`);
  o.querySelectorAll('.card').forEach(c=>c.onclick=()=>{st.sel=+c.dataset.i;draw()});
  extras(M,R);
}
const fm=m=>{m=Math.round(m);const d=m>=1440?' (+1 day)':'';m%=1440;const h=Math.floor(m/60);return `${(h%12)||12}:${String(m%60).padStart(2,'0')} ${h<12?'AM':'PM'}${d}`};
const lv=m=>m<1.3?'Free':m<1.8?'Moderate':m<2.4?'Heavy':'Severe';
function bestTimes(){const h0=st.h,out=[];for(let h=0;h<24;h++){st.h=h;out.push(routes(eMetrics())[0].T)}st.h=h0;return out}
function extras(M,R){
  const r=R[st.sel],t0=st.h*60,bt=bestTimes(),mx=Math.max(...bt),best=bt.indexOf(Math.min(...bt)),sv=bt[st.h]-bt[best];
  const bars=bt.map((v,h)=>{const bh=v/mx*90,x=h*20+8;return `<rect x="${x}" y="${100-bh}" width="14" rx="2" height="${bh}" fill="${h==best?'var(--free)':h==st.h?'var(--route)':'var(--line)'}"><title>${fm(h*60)}: ${v.toFixed(0)} min</title></rect>`+(h%3==0?`<text x="${x+7}" y="116" text-anchor="middle">${h}h</text>`:'')}).join('');
  const steps=r.ed.map((i,k)=>`<li><span class="dot" style="background:${col(M[i].m)}"></span><b>${E[i][8]}</b><span>${names[r.p[k]]} to ${names[r.p[k+1]]} · ${M[i].t.toFixed(0)} min · ${lv(M[i].m)} traffic · ${E[i][9]} road${E[i][7]?' · waterlogging-prone':''}</span></li>`).join('');
  const hot=M.map((m,i)=>[m.m,i]).sort((a,b)=>b[0]-a[0]).slice(0,4).map(([m,i])=>`<li><span class="dot" style="background:${col(m)}"></span><b>${E[i][8]}</b><span>${names[E[i][0]]} to ${names[E[i][1]]} · ${m.toFixed(1)}x slower than free flow</span></li>`).join('');
  $('extra').innerHTML=`<h2 style="margin-top:0">Trip details</h2><p class="eta">Leave ${fm(t0)}, arrive <b>${fm(t0+r.T)}</b> (${r.T.toFixed(0)} min)</p><ul class="steps">${steps}</ul>
<h2>Best time to leave</h2><p class="sub">${sv>=1?`Leaving at <b>${fm(best*60)}</b> would save about ${sv.toFixed(0)} min compared with ${fm(t0)}.`:'Your chosen time is already about the best for this trip.'}</p><svg viewBox="0 0 490 124" style="max-height:none" role="img" aria-label="Travel time by departure hour">${bars}</svg>
<h2>Slowest roads at this hour</h2><ul class="steps">${hot}</ul>`;
}
function seg(id,key){$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{$(id).querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');st[key]=b.dataset.v;refresh()})}
['s','d'].forEach(id=>{$(id).innerHTML=names.map((n,i)=>`<option value="${i}">${n}</option>`).join('');$(id).value=st[id];$(id).onchange=()=>{st[id]=+$(id).value;st.sel=0;draw()}});
$('s').value=names.indexOf('Majestic');st.s=+$('s').value;$('d').value=names.indexOf('Whitefield');st.d=+$('d').value;
seg('day','day');seg('wx','wx');seg('eng','engine');
const fh=h=>`${(h%12)||12}:00 ${h<12?'AM':'PM'}`;
$('h').oninput=()=>{st.h=+$('h').value;$('hl').textContent=fh(st.h);st.sel=0;draw()};$('hl').textContent=fh(9);
['wt','wd','wr'].forEach(id=>{const f=()=>{$(id).nextElementSibling.textContent=$(id).value;st.sel=0;draw()};$(id).oninput=f;$(id).nextElementSibling.textContent=$(id).value});
$('ap').onchange=$('aw').onchange=()=>{st.sel=0;draw()};
function syncSel(){$('s').value=st.s;$('d').value=st.d}
$('swap').onclick=()=>{[st.s,st.d]=[st.d,st.s];syncSel();st.sel=0;draw()};
$('loc').onclick=()=>{const g=$('geo');
  if(!navigator.geolocation){g.textContent='Location is not available in this browser.';return}
  navigator.geolocation.getCurrentPosition(pos=>{let b=0,bd=1e9;
    N.forEach((n,i)=>{const dd=Math.hypot((n[2]-pos.coords.longitude)*108,(n[1]-pos.coords.latitude)*111);if(dd<bd){bd=dd;b=i}});
    if(bd>30){g.textContent='You seem to be outside Bengaluru. Pick your start from the list.';return}
    st.s=b;syncSel();g.textContent='Starting from '+names[b]+', the nearest junction ('+bd.toFixed(1)+' km away).';st.sel=0;draw();
  },()=>{g.textContent='Location permission was blocked. Pick your start from the list.'},{timeout:8000})};
let saved=[];try{saved=JSON.parse(localStorage.getItem('spp_saved')||'[]')}catch(e){}
function chips(){$('chips').innerHTML=saved.map((t,i)=>`<button data-i="${i}">${names[t[0]]} to ${names[t[1]]}</button>`).join('');
  $('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{const t=saved[+b.dataset.i];st.s=t[0];st.d=t[1];syncSel();st.sel=0;draw()})}
$('sv').onclick=()=>{if(st.s==st.d||saved.some(t=>t[0]==st.s&&t[1]==st.d))return;saved=saved.concat([[st.s,st.d]]).slice(-6);try{localStorage.setItem('spp_saved',JSON.stringify(saved))}catch(e){}chips()};
chips();
draw();
</script></body></html>
